# Production Docker Compose for AWS EC2 (ARM64 / Graviton)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# All ports are bound to 127.0.0.1 so they are NOT reachable
# from the internet. The Streamlit apps (running via systemd,
# not in Docker) connect to these services on localhost.

services:
  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/arm64
    container_name: sin_chatbot_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: sin_chatbot_postgres
    environment:
      POSTGRES_USER: sinchatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env}
      POSTGRES_DB: sin_chatbot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinchatbot -d sin_chatbot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "max_connections=50"

volumes:
  qdrant_data:
  postgres_data:
